# Si prefieres levantar alguno a mano, un modelo sin `comando` es externo:
# Loomcast lo usa donde esté pero no lo arranca ni lo para.
# [[llm.modelos]]
# id = "manual"
# nombre = "El que yo levante"
# url = "http://127.0.0.1:9876"

[comfy]
url = "http://127.0.0.1:8188"
# Cuánto espera Loomcast a que ComfyUI termine un workflow antes de darlo por
# perdido. Debe cubrir el clip i2v más lento: con 21 cuadros ronda los 250 s,
# pero si el equipo se suspende o se ralentiza conviene margen de sobra.
timeout_s = 1800

[video]
# Codificador para los clips y el armado final.
#  "hardware" → h264_videotoolbox: usa el motor de medios de Apple, muy poca
#               CPU y más rápido. Recomendado en Apple Silicon.
#  "software" → libx264: máxima calidad por bit, pero satura la CPU.
encoder = "hardware"
# Bitrate objetivo del modo hardware (VideoToolbox no usa CRF).
bitrate_mbps = 12
# Calidad del modo software (CRF: menor = más calidad, ~18 es visualmente sin pérdida).
crf = 18
# Segundos de imagen que quedan tras acabar la narración, para que el video no
# corte en seco sobre la última palabra. Si los clips ya duran más que la voz,
# manda su duración y esta cola no se aplica. 0 = cortar con el audio.
cola_final_s = 1.5

[i2v]
# Modo image-to-video (movimiento generado por IA). Agnóstico al motor: apunta
# a un workflow de ComfyUI en formato API que TÚ exportas y ajustas (LTX-Video,
# WAN, etc.). El workflow debe incluir los placeholders {IMAGE}, {PROMPT} y
# {SEED}, y un nodo que guarde el video (VHS_VideoCombine / SaveVideo).
workflow = "workflows/i2v_api.json"
# Cuadros que genera el modelo i2v por escena (placeholder {FRAMES} del
# workflow). Más cuadros = más recorrido de movimiento y menos estiramiento de
# RIFE, pero el coste sube lineal (~12 s por cuadro en M3 Max). HunyuanVideo
# exige la forma 4n+1: 13, 17, 21, 25…
frames = 21
# fps que produce tu modelo i2v (para saber cuánto interpola RIFE).
fps_origen = 24
# fps de los clips i2v tras la interpolación. Déjalo en 60: es el ritmo al que
# el armado concatena los clips, así que cualquier otro valor obliga a ffmpeg a
# duplicar cuadros al final. RIFE genera los que hagan falta sin coste extra.
fps_final = 60

[rife]
# rife-ncnn-vulkan (descargado en Fase 0). Corre en GPU vía Vulkan/MoltenVK.
bin = "tools/rife-ncnn-vulkan-20221029-macos/rife-ncnn-vulkan"
modelo = "rife-v4.6"

[edicion]
# Edición de imágenes de la galería. Como en [i2v], apunta a un workflow de
# ComfyUI en formato API que TÚ exportas con un modelo instruct-edit
# (recomendado: Qwen-Image-Edit 2509 GGUF, que reutiliza tu text encoder
# qwen_2.5_vl_7b y evita el fp8 que Metal no soporta). El workflow debe incluir
# los placeholders {IMAGE}, {PROMPT} y {SEED}, y un nodo SaveImage.
workflow = "workflows/qwen_edit_api.json"

[musica]
# Generación de música local con ACE-Step (ACE Studio + StepFun): corre en
# Apple Silicon vía Metal/MPS y tiene soporte nativo en ComfyUI. Descarga
# `ace_step_v1_3.5b.safetensors` a ComfyUI/models/checkpoints y exporta la
# plantilla "ACE-Step Text-to-Music" en formato API con los placeholders
# {TAGS} (TextEncodeAceStepAudio→tags), {LYRICS} (→lyrics),
# {DURACION} (EmptyAceStepLatentAudio→seconds) y {SEED} (KSampler→seed), más un
# nodo SaveAudio (o SaveAudioMP3).
workflow = "workflows/musica_api.json"
# Duración por defecto de una pista nueva, en segundos.
duracion_s = 30

[paths]
proyectos = "proyectos"
plantillas = "plantillas"
voces = "voces"
galeria = "galeria"
musica = "musica"
db = "loomcast.db"
