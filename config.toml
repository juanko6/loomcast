# Configuración de Loomcast — servicios locales

[llm]
# llama-server (API OpenAI-compatible). Loomcast NO impone ajustes del modelo:
# el sampling (--temp/--top-p/--top-k), contexto y reasoning los define TU
# script de arranque. Aquí solo se declara qué modelos tienes y cómo levantarlos.
#
# Ciclo de vida: si un modelo trae `comando`, Loomcast lo arranca justo antes de
# una etapa de texto (ideas, guion, metadatos, prompts de escena) y lo para
# antes de cualquier etapa de voz/GPU, para dejarle la memoria unificada a
# ComfyUI. Un modelo sin `comando` se comporta como siempre: lo levantas tú y
# Loomcast no lo toca.
autostart = true
# Segundos de inactividad tras los que se descarga el modelo aunque no haya
# llegado un job de voz/GPU. Encadenar ideas → guion → metadatos no debería
# pagar el arranque cuatro veces, así que conviene un margen holgado.
inactividad_s = 300
# Cuánto se espera a que el llama-server responda tras lanzarlo antes de darlo
# por fallido (la primera carga de un modelo grande desde disco es lenta).
espera_arranque_s = 240

# Valores por defecto para todos los modelos; cada uno puede sobrescribirlos.
# Nombre del modelo: informativo; llama-server usa el que tenga cargado.
model = "local"
# GiB de memoria unificada libres que hacen falta para cargar un modelo. No
# reserva nada: es la condición que se comprueba antes de lanzarlo, y si no se
# cumple el job falla diciéndolo en vez de dejar que el kernel elija a quién
# mata. El 2026-10-19 el backend murió con `Killed: 9` justo aquí: ComfyUI
# retenía 11,7 GiB de Z-Image y encima se lanzó un MLX de ~20 GiB.
#
# 22 está medido en este M3 Max de 48 GiB: con Z-Image dentro quedan 16,4 GiB
# libres (no basta), y en cuanto ComfyUI suelta sube a 27,0 (sobra). Un modelo
# pequeño puede declarar menos con su propio `memoria_gb`.
memoria_gb = 22
timeout_s = 600
# Un guion entero no cabe en 4096: el 2026-10-12 uno se cortó a mitad de la
# segunda frase y el error salió como "JSON inválido del modelo". Si vuelve a
# pasar, el cliente ahora lo dice con todas las letras y la respuesta es subir
# esto (o `max_tokens` del modelo concreto).
max_tokens = 16384

# Opcional — descoméntalo SOLO si quieres que Loomcast fuerce la temperatura
# por encima de la de tu script. Si se omite, manda tu llama-server.
# temperature = 0.8

# Apaga el "pensamiento" del modelo en las tareas del pipeline (son de formato
# JSON y no lo necesitan; con reasoning activo tardan 5-10x más).
# Qwen3/3.6: { enable_thinking = false }. Otra familia: ajusta la clave o
# borra la línea y desactiva el reasoning en tu script.
chat_template_kwargs = { enable_thinking = false }

# Tus modelos. El selector de la cabecera los lista por `nombre` y el primero es
# el que se usa mientras no elijas otro (la elección se guarda en la BD).
#
# `comando` es tu script de arranque tal cual: se ejecuta con sh desde la raíz
# del proyecto, así que admite ~, variables y argumentos. Tiene que quedarse en
# primer plano — nada de `&` ni `nohup` — o Loomcast no podrá pararlo. Su salida
# va a logs/llm-<id>.log.
#
# Cada modelo puede sobrescribir url, model, timeout_s, max_tokens, temperature
# y chat_template_kwargs.
# IMPORTANTE: `url` tiene que apuntar al puerto que abre ESE script. Todos tus
# scripts de ~/Models están igualados a 127.0.0.1:9876; si cambias el --port de
# alguno, cambia aquí su url. Como solo corre uno a la vez, compartir puerto da
# igual. Borra los modelos que no quieras ver en el desplegable.

[[llm.modelos]]
id = "qwen36-27b"
nombre = "Qwen3.6 27B"
comando = "~/Models/qwen_3.6_27b.sh"
url = "http://127.0.0.1:9876"

[[llm.modelos]]
id = "qwen36-27b-mtp"
nombre = "Qwen3.6 27B MTP"
comando = "~/Models/qwen_3.6_27b_mtp.sh"
url = "http://127.0.0.1:9876"

[[llm.modelos]]
id = "qwen36-35b"
nombre = "Qwen3.6 35B E3M MTP"
comando = "~/Models/qwen_3.6_35b_e3m_mtp.sh"
url = "http://127.0.0.1:9876"

[[llm.modelos]]
id = "qwen35-9b"
nombre = "Qwen3.5 9B"
comando = "~/Models/qwen_3.5_9b.sh"
url = "http://127.0.0.1:9876"

[[llm.modelos]]
id = "qwen35-9b-mtp"
nombre = "Qwen3.5 9B MTP"
comando = "~/Models/qwen_3.5_9b_mtp.sh"
url = "http://127.0.0.1:9876"

[[llm.modelos]]
id = "qwen35-9b-8bit"
nombre = "Qwen3.5 9B 8bit MTP"
comando = "~/Models/qwen_3.5_9b_8bit_mtp.sh"
url = "http://127.0.0.1:9876"

# Gemma no usa la clave enable_thinking de Qwen: se limpia la heredada de [llm].
# Si lo notas lento, es que tus scripts llevan --reasoning on; cámbialo ahí.
[[llm.modelos]]
id = "gemma4-12b"
nombre = "Gemma 4 12B"
comando = "~/Models/gemma4_12b.sh"
url = "http://127.0.0.1:9876"
chat_template_kwargs = {}

[[llm.modelos]]
id = "gemma4-26b"
nombre = "Gemma 4 26B"
comando = "~/Models/gemma4_26b.sh"
url = "http://127.0.0.1:9876"
chat_template_kwargs = {}

[[llm.modelos]]
id = "gemma4-31b"
nombre = "Gemma 4 31B"
comando = "~/Models/gemma4_31b.sh"
url = "http://127.0.0.1:9876"
chat_template_kwargs = {}

# Qwen3.8 27B por llama.cpp. SIN `comando` a propósito: sus scripts empiezan con
# `sudo sysctl iogpu.wired_limit_mb=43008` para subir el techo de RAM de la GPU,
# y Loomcast no puede responder a la petición de contraseña. Levántalos tú
# (`~/Models/qwen_3.8_27B_Q4.sh`) y Loomcast los usa donde estén; si prefieres
# que los arranque él, quita el sudo del script y añade aquí su `comando`.
[[llm.modelos]]
id = "qwen38-27b-q4"
nombre = "Qwen3.8 27B Q4 (a mano)"
url = "http://127.0.0.1:9876"

[[llm.modelos]]
id = "qwen38-27b-q4-xs"
nombre = "Qwen3.8 27B Q4_XS (a mano)"
url = "http://127.0.0.1:9876"

# ---------------------------------------------------------------- MLX
# Los mismos modelos por MLX en vez de llama.cpp, servidos con mlx_lm.server,
# que también habla la API de OpenAI. Los pesos están en ~/.cache/huggingface y
# `--model` los carga de ahí sin volver a descargarlos.
#
# OJO con `model`: mlx_lm.server trata ese campo como un repo de Hugging Face y
# se lo descarga si no lo tiene. Con el "local" que Loomcast manda por defecto
# responde 404 ("Repository Not Found for url: .../models/local"), así que cada
# uno declara aquí su id real. No es decorativo: sin esto no responde.
#
# Los repos `-MTP-4bit` que también tienes descargados NO se pueden declarar:
# su `model_type` es `qwen3_5_mtp` y mlx_lm responde "Model type qwen3_5_mtp not
# supported", ni como modelo ni pasado en --draft-model, que es para lo que
# sirven en realidad (son el drafter de decodificación especulativa, el
# equivalente al --model-draft de los scripts de llama.cpp). El soporte va en el
# PR #990 de ml-explore/mlx-lm, que sigue ABIERTO: no está ni en la 0.32.0, así
# que actualizar no lo arregla. Mientras tanto, el 35B A3B con MTP va por
# llama.cpp, en `qwen36-35b` de aquí arriba.
#
# Cuando el PR salga, el MTP se añade al modelo base, no como modelo aparte:
#   comando = "… --model mlx-community/Qwen3.6-35B-A3B-4bit --draft-model mlx-community/Qwen3.6-35B-A3B-MTP-4bit --port 9876"
[[llm.modelos]]
id = "mlx-qwen36-35b"
nombre = "Qwen3.6 35B A3B (MLX)"
comando = "~/Models/mlx/venv/bin/mlx_lm.server --model mlx-community/Qwen3.6-35B-A3B-4bit --port 9876"
url = "http://127.0.0.1:9876"
model = "mlx-community/Qwen3.6-35B-A3B-4bit"

[[llm.modelos]]
id = "mlx-qwen38-27b"
nombre = "Qwen3.8 27B (MLX)"
comando = "~/Models/mlx/venv/bin/mlx_lm.server --model mlx-community/Qwen3.8-27B-4bit --port 9876"
url = "http://127.0.0.1:9876"
model = "mlx-community/Qwen3.8-27B-4bit"

# Si prefieres levantar alguno a mano, un modelo sin `comando` es externo:
# Loomcast lo usa donde esté pero no lo arranca ni lo para.
# [[llm.modelos]]
# id = "manual"
# nombre = "El que yo levante"
# url = "http://127.0.0.1:9876"

[comfy]
url = "http://127.0.0.1:8188"
# Cuánto espera Loomcast a que ComfyUI termine un workflow antes de darlo por
# perdido. Debe cubrir el clip i2v más lento: con 21 cuadros ronda los 250 s,
# pero si el equipo se suspende o se ralentiza conviene margen de sobra.
timeout_s = 1800
# Cuánto se espera a ver la memoria libre después de pedirle a ComfyUI que
# suelte los modelos. El `POST /free` solo enciende una bandera que su hilo de
# ejecución atiende entre prompts: medido, la descarga llega ~1,7 s después,
# pero si ComfyUI está acabando un workflow no mira la bandera hasta terminarlo.
espera_liberacion_s = 20

[stt]
# Transcripción (subtítulos y el ref_text del clonado de voz), con
# faster-whisper. A diferencia del mlx-whisper de antes, esto corre igual en
# Mac y en Linux: en Mac va por CPU (CTranslate2 no tiene Metal), y para clips
# de 30-60 s dentro de un pipeline de minutos el coste es irrelevante.
modelo = "turbo"
# "auto" elige cuda si la hay y cpu si no. Fíjalo a mano solo si quieres forzar.
dispositivo = "auto"
# int8 es lo razonable en CPU. Con GPU NVIDIA, "float16".
compute_type = "int8"
# Idioma del audio. Vacío ("") = que lo detecte Whisper.
idioma = "es"

[video]
# Codificador para los clips y el armado final.
#  "hardware" → h264_videotoolbox: usa el motor de medios de Apple, muy poca
#               CPU y más rápido. Recomendado en Apple Silicon.
#  "software" → libx264: máxima calidad por bit, pero satura la CPU.
encoder = "hardware"
# Bitrate objetivo del modo hardware (VideoToolbox no usa CRF).
bitrate_mbps = 12
# Calidad del modo software (CRF: menor = más calidad, ~18 es visualmente sin pérdida).
crf = 18
# Segundos de imagen que quedan tras acabar la narración, para que el video no
# corte en seco sobre la última palabra. Si los clips ya duran más que la voz,
# manda su duración y esta cola no se aplica. 0 = cortar con el audio.
cola_final_s = 1.5
# Mezcla de la música del proyecto en el video final. Solo se aplica si el paso
# de Música tiene la mezcla activada; la pista siempre se puede descargar sola.
#
# Nivel al que entra la cama, en dB respecto a la pista original (que sale
# masterizada a -14 LUFS). Con -16 dB se oye bajo la narración sin pelearse con
# ella; súbelo hacia -10 para música más protagonista. Encima de esto actúa el
# ducking (sidechaincompress), que la baja sola mientras se habla.
musica_db = -16.0
# Fades de entrada y salida de la cama, en segundos. El de salida se coloca
# donde acaba la música, no donde acaba el video.
musica_fade_s = 2.0

[i2v]
# Modo image-to-video (movimiento generado por IA). Agnóstico al motor: cada uno
# se declara en [i2v.motores.*] apuntando a un workflow de ComfyUI en formato
# API que TÚ exportas y ajustas. El workflow debe incluir los placeholders
# {IMAGE}, {PROMPT}, {SEED} y {FRAMES}, y un nodo que guarde el video
# (VHS_VideoCombine / SaveVideo).
#
# `frames` y `fps_origen` van en cada motor, no aquí: son propiedad del modelo.
# Pedirle a Hunyuan los 25 cuadros de LTX le costaría ~360 s por escena en vez
# de 303, y un modelo que entregue a 16 fps cambiaría lo que interpola RIFE.
#
# Motor que se preselecciona en el paso de vídeo; en la UI se puede cambiar
# antes de generar, y cada escena guarda con cuál se hizo su clip.
motor = "ltx25"
# fps de los clips i2v tras la interpolación. Este sí es global: es el ritmo al
# que el armado concatena los clips, así que cualquier otro valor obliga a
# ffmpeg a duplicar cuadros al final. RIFE genera los que hagan falta sin coste.
fps_final = 60

[i2v.motores.ltx25]
# LTX-2.5 (22B destilado, GGUF Q4_0). Sustituyó a HunyuanVideo 1.5 el
# 2026-10-12 tras medir los dos en el M3 Max con la misma imagen, prompt y
# semilla, en caliente y a 8 pasos:
#
#   LTX-2.5            480x864,  25 cuadros ......  90 s
#   LTX-2.5            768x1376, 25 cuadros ..... 213 s
#   HunyuanVideo 1.5   480x848,  21 cuadros ..... 303 s
#
# Va a 768x1376, la resolución de las imágenes de escena: cuesta menos que lo
# que tardaba Hunyuan a 480 y el armado tiene que estirar mucho menos para
# llegar a 1080x1920. Para cambiarla, el nodo ResolutionSelector del workflow.
#
# El text encoder va en CPU (`"device": "cpu"` en su CLIPLoader) igual que en
# los workflows de imagen. Con --gpu-only, en GPU compite con el DiT: ComfyUI lo
# soltaba para hacer sitio al muestreo y lo recargaba en la escena siguiente, y
# ese vaivén de 14,6 GB metía 15 GB de swap. En CPU el swap se queda en 0,6 GB.
#
# Necesita el parche del GGUF (`python scripts/instalar_parches.py`): el fichero
# de molbal trae `keyframes_abs_pos_embedding` cuantizado siendo un parámetro
# suelto, y sin dequantizarlo ComfyUI no carga el modelo.
#
# Genera también una pista de audio (es un modelo audio-vídeo) que Loomcast no
# usa: el ffmpeg que escala el clip ya pasa -an.
nombre = "LTX-2.5"
workflow = "workflows/i2v_ltx25_api.json"
# Cuadros por escena ({FRAMES} del workflow). Más cuadros = más recorrido de
# movimiento y menos estiramiento de RIFE. LTX los quiere de la forma 4n+1.
frames = 25
fps_origen = 24

[i2v.motores.hunyuan]
# HunyuanVideo 1.5 GGUF Q8, el motor anterior. Se mantiene porque es más rápido
# a resoluciones bajas si alguna vez prefieres tiempo sobre nitidez, y para
# poder comparar movimiento escena a escena.
#
# Su text encoder tiene que ser el fp16, no el fp8_scaled: Metal no implementa
# Float8_e4m3fn.
nombre = "HunyuanVideo 1.5"
workflow = "workflows/i2v_api.json"
# HunyuanVideo exige la forma 4n+1: 13, 17, 21, 25…
frames = 21
fps_origen = 24

[rife]
# rife-ncnn-vulkan (descargado en Fase 0). Corre en GPU vía Vulkan/MoltenVK.
bin = "tools/rife-ncnn-vulkan-20221029-macos/rife-ncnn-vulkan"
modelo = "rife-v4.6"

[imagen]
# Motores de imagen disponibles. Cada uno declara los modos que sabe hacer
# apuntando a un workflow de ComfyUI en formato API: `generar` (texto→imagen,
# placeholders {PROMPT}, {SEED}, {WIDTH}, {HEIGHT}) y/o `editar` (instruct-edit
# sobre una imagen subida, placeholders {IMAGE}, {PROMPT}, {SEED}). Los
# placeholders numéricos van entrecomillados en el JSON para que el archivo siga
# siendo válido y puedas abrirlo tal cual en ComfyUI; Loomcast quita las comillas
# al sustituir.
#
# Motor que se preselecciona en la galería, y el que usa el pipeline de vídeo
# para las imágenes de escena.
motor_generar = "zimage"
motor_editar = "qwen"
# Tamaño que se usa cuando quien llama no especifica uno (pipeline de vídeo).
width = 768
height = 1344

[imagen.motores.zimage]
nombre = "Z-Image Turbo"
generar = "workflows/z_image_turbo_api.json"

[imagen.motores.zimage_retrato]
# El mismo Z-Image, pero con 16 pasos en vez de 8. Es para los retratos de
# personaje: se generan una vez y se reutilizan en todas las escenas de ese
# personaje, así que ahí sí compensa pagar el doble de tiempo por más detalle
# en la cara. Si no notas diferencia, apunta [personajes].motor a "zimage".
nombre = "Z-Image (retrato)"
generar = "workflows/z_image_retrato_api.json"

[imagen.motores.qwen]
# Qwen-Image-Edit 2511 GGUF Q4_K_M + Lightning de 4 pasos, con el text encoder
# qwen2.5-vl en GGUF para esquivar el fp8 que Metal no soporta. Admite tres
# referencias, y es el motor de las escenas con personaje: es el que mejor
# conserva la cara y la ropa del retrato. ~2 min por imagen con una referencia
# y ~3:20 con dos, medidos en el M3 Max.
#
# Necesita el parche de MPS (`python scripts/instalar_parches.py`): sus nodos
# escalan las referencias con interpolate(mode="area"), que en Metal solo
# funciona si el tamaño de entrada es divisible por el de salida, y con una
# referencia cualquiera revienta con "Adaptive pool MPS: input sizes must be
# divisible by output sizes".
nombre = "Qwen-Image-Edit 2511"
editar = "workflows/qwen_edit_2511_api.json"

[imagen.motores.flux2klein]
# FLUX.2 Klein 9B (GGUF Q8_0 + encoder qwen_3_8b_fp4mixed): genera y edita con
# los mismos pesos. ~50 s generando y ~76 s editando en el M3 Max.
nombre = "FLUX.2 Klein 9B"
generar = "workflows/flux2_klein_t2i_api.json"
editar = "workflows/flux2_klein_edit_api.json"

[personajes]
# Retrato de referencia de cada personaje del reparto: la cara oficial con la
# que luego se generan sus escenas, para que sea la misma persona en todas.
#
# `motor` es un id de [imagen.motores] que sepa generar. El retrato se hace una
# sola vez por personaje y se reutiliza, así que su coste da igual y conviene
# el motor que mejor cara dé, no el más rápido.
motor = "zimage_retrato"
# 3:4 en vez del 9:16 del vídeo: es un plano medio, y en vertical se
# desperdiciaría ancho en el que no hay nada. El formato del retrato no
# condiciona el de las escenas.
width = 768
height = 1024
#
# Motor con el que se generan las escenas donde sale un personaje: en vez de
# texto→imagen, toma su retrato como referencia visual y lo lleva a la escena.
# Tiene que declarar `editar`.
#
# qwen (Qwen-Image-Edit 2511), que es el que está entrenado para llevar a una
# persona de una imagen a otra y se nota: conserva los rasgos y la ropa del
# retrato donde Klein deja la cara en sombra y sin parecido. Además admite tres
# referencias y Klein solo una, así que una escena con dos personajes ya no
# tiene que renunciar a una cara.
#
# Cuesta unos 30 s más por escena que Klein (~132 s frente a ~102 s con una
# referencia). Si prefieres el tiempo al parecido, pon "flux2klein".
motor_escena = "qwen"

[musica]
# Generación de música local con ACE-Step 1.5 XL Turbo (ACE Studio + StepFun):
# corre en Apple Silicon vía Metal/MPS y tiene soporte nativo en ComfyUI (nodos
# TextEncodeAceStepAudio1.5 / EmptyAceStep1.5LatentAudio, sin custom nodes).
# Sale a 48 kHz y, a diferencia de v1, acepta conditioning musical explícito
# (tempo, tonalidad, compás), que es lo que evita que el arreglo derive y los
# instrumentos se tapen entre sí.
#
# Descarga a ComfyUI/models/ desde Comfy-Org/ace_step_1.5_ComfyUI_files:
#   diffusion_models/  acestep_v1.5_xl_turbo_bf16.safetensors  (9,97 GB)
#   text_encoders/     qwen_0.6b_ace15.safetensors             (1,19 GB)
#   text_encoders/     qwen_4b_ace15.safetensors               (8,38 GB)
#   vae/               ace_1.5_vae.safetensors                 (0,34 GB)
# Ojo: NO hay versión GGUF usable en ComfyUI (los GGUF que circulan son para
# acestep.cpp, y ComfyUI-GGUF no soporta la arquitectura ace-step).
workflow = "workflows/musica_api.json"
# Duración por defecto de una pista nueva, en segundos.
duracion_s = 30
# IMPORTANTE: arranca ComfyUI con --gpu-only (`comfy launch -- --gpu-only`). Sin
# ese flag ComfyUI deja los text encoders en la CPU en todos los Mac, y aquí el
# "text encoder" es el LM de 4B que planifica la canción: 166,6 s por pista de
# 30 s en vez de 30,1 s. Ver la sección "Música" del README.
#
# Activa el LM planificador (generate_audio_codes): un Qwen que planea la
# estructura de la pista antes de sintetizarla. Es lo que sube la calidad y
# también el grueso del tiempo; ponlo en false para bajar a ~2 s por pista a
# costa de generar sin plan de estructura.
audio_codes = true
# Temperatura del muestreo del LM planificador. A 0 usa argmax (decodificación
# voraz) y las pistas salen monótonas: el mismo bucle repetido. Con 0.85 el plan
# es mucho más elaborado. Verificado a oído, no por métricas.
lm_temperature = 0.85
#
# Dónde corre el LM planificador: "default" (la GPU) o "cpu".
#
# EN GPU **SOLO** SI EL PARCHE ESTÁ INSTALADO:
#     python scripts/instalar_parches.py
#
# Sin él, torch.multinomial en Metal devuelve a veces índices con probabilidad
# CERO. Lo dispara la presencia de entradas a cero (aquí, los ~153k tokens que
# no son códigos de audio y se enmascaran), y la tasa sube con cuántas haya. Eso
# tumba las pistas de más de ~33 s y degrada en silencio las cortas.
#
# El parche quita los ceros antes de muestrear y lo arregla: 90 s en 60 s y
# 189 s en 104 s, frente a los ~410 s que costaban los mismos 90 s con el LM en
# CPU.
# Si alguna vez quieres quitarlo, pon "cpu" aquí: es más lento pero no depende
# de nada externo.
lm_device = "default"
# Masterizado con ffmpeg al terminar cada pista (EBU R128, en dos pasadas).
# ACE-Step entrega el audio crudo: ~-17 LUFS y picos a 0,0-0,1 dBTP, o sea
# distorsionando. -14 LUFS es el nivel al que normalizan YouTube y Spotify;
# -1 dBTP deja margen para que el pico real no toque el techo.
# El original sin tocar se guarda al lado como crudo.flac.
# Pon lufs = 0 para desactivarlo y quedarte solo con el crudo.
lufs = -14.0
true_peak = -1.0
# Portada de la pista: imagen cuadrada que genera el motor de imagen por
# defecto ([imagen].motor_generar) en un job encadenado tras la sugerencia
# del LLM. Pequeña a propósito: a 384 px cuesta 6 s en el M3 Max y a 512 px,
# 12 s, y se ve como miniatura de 48 px en la lista.
portada_px = 384

[cola]
# Reintentos de un job que se cae por algo transitorio: ComfyUI que todavía no
# responde, un proceso externo que se pasa de su tope, el llama-server
# reiniciándose. Lo que no se arregla repitiendo (faltan escenas, falta la pista
# de música, el workflow no existe) sigue fallando al primer intento.
#
# Intentos TOTALES, contando el primero. Tres porque los fallos que se curan
# solos lo hacen en el primer reintento, y cada intento de una etapa de GPU
# puede costar lo que diga [comfy].timeout_s: con más, un lote de doce escenas
# se pasaría media hora fallando antes de avisar.
intentos = 3
# Espera antes de reintentar, en segundos; se dobla en cada intento (20 s, luego
# 40 s). Crece porque lo que suele fallar es un servicio que está arrancando o
# recuperándose, y volver a llamarlo de inmediato lo encuentra igual de ocupado.
espera_s = 20

[autopiloto]
# Paradas de revisión humana que respeta el autopiloto. Son las tres que ya
# tiene el flujo a mano, y están aquí porque corregir en ellas es barato y el
# error se propaga caro:
#
#   idea    — qué ideas se producen. En un lote, con esta parada puesta solo
#             entran las ideas que alguien aprobó; sin ella entran también las
#             propuestas, y entonces es "tema → vídeos" sin tocar nada.
#   guion   — el texto lo decide todo: un guion malo son veinte minutos de GPU
#             tirados en imágenes, clips y montaje.
#   escenas — los prompts de escena, justo antes de gastar GPU en las imágenes,
#             que es la etapa cara.
#
# Vaciar la lista (paradas = []) es producción sin manos. Lo que se pone aquí es
# el valor por defecto: al lanzar un autopiloto o un lote se pueden elegir otras.
paradas = ["idea", "guion", "escenas"]

[paths]
proyectos = "proyectos"
plantillas = "plantillas"
voces = "voces"
# Reparto propio: los personajes reutilizables entre vídeos, con su retrato.
reparto = "reparto"
galeria = "galeria"
musica = "musica"
db = "loomcast.db"
