# Configuración de Loomcast — servicios locales

[llm]
# llama-server (API OpenAI-compatible). Loomcast NO impone ajustes del modelo:
# el sampling (--temp/--top-p/--top-k), contexto y reasoning los define TU
# script de arranque. Aquí solo se apunta al puerto donde levantaste el modelo.
url = "http://127.0.0.1:9876"
# Nombre del modelo: informativo; llama-server usa el que tenga cargado.
model = "local"
timeout_s = 600
max_tokens = 4096

# Opcional — descoméntalo SOLO si quieres que Loomcast fuerce la temperatura
# por encima de la de tu script. Si se omite, manda tu llama-server.
# temperature = 0.8

# Apaga el "pensamiento" del modelo en las tareas del pipeline (son de formato
# JSON y no lo necesitan; con reasoning activo tardan 5-10x más).
# Qwen3/3.6: { enable_thinking = false }. Otra familia: ajusta la clave o
# borra la línea y desactiva el reasoning en tu script.
chat_template_kwargs = { enable_thinking = false }

[comfy]
url = "http://127.0.0.1:8188"

[video]
# Codificador para los clips y el armado final.
#  "hardware" → h264_videotoolbox: usa el motor de medios de Apple, muy poca
#               CPU y más rápido. Recomendado en Apple Silicon.
#  "software" → libx264: máxima calidad por bit, pero satura la CPU.
encoder = "hardware"
# Bitrate objetivo del modo hardware (VideoToolbox no usa CRF).
bitrate_mbps = 12
# Calidad del modo software (CRF: menor = más calidad, ~18 es visualmente sin pérdida).
crf = 18

[i2v]
# Modo image-to-video (movimiento generado por IA). Agnóstico al motor: apunta
# a un workflow de ComfyUI en formato API que TÚ exportas y ajustas (LTX-Video,
# WAN, etc.). El workflow debe incluir los placeholders {IMAGE}, {PROMPT} y
# {SEED}, y un nodo que guarde el video (VHS_VideoCombine / SaveVideo).
workflow = "workflows/i2v_api.json"
# fps que produce tu modelo i2v (para saber cuánto interpola RIFE).
fps_origen = 24
# fps final tras la interpolación (múltiplo del origen: 24→48, 24→72…).
fps_final = 48

[rife]
# rife-ncnn-vulkan (descargado en Fase 0). Corre en GPU vía Vulkan/MoltenVK.
bin = "tools/rife-ncnn-vulkan-20221029-macos/rife-ncnn-vulkan"
modelo = "rife-v4.6"

[paths]
proyectos = "proyectos"
plantillas = "plantillas"
voces = "voces"
db = "loomcast.db"
