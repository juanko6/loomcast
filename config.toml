# Si prefieres levantar alguno a mano, un modelo sin `comando` es externo:
# Loomcast lo usa donde esté pero no lo arranca ni lo para.
# [[llm.modelos]]
# id = "manual"
# nombre = "El que yo levante"
# url = "http://127.0.0.1:9876"

[comfy]
url = "http://127.0.0.1:8188"
# Cuánto espera Loomcast a que ComfyUI termine un workflow antes de darlo por
# perdido. Debe cubrir el clip i2v más lento: con 21 cuadros ronda los 250 s,
# pero si el equipo se suspende o se ralentiza conviene margen de sobra.
timeout_s = 1800

[video]
# Codificador para los clips y el armado final.
#  "hardware" → h264_videotoolbox: usa el motor de medios de Apple, muy poca
#               CPU y más rápido. Recomendado en Apple Silicon.
#  "software" → libx264: máxima calidad por bit, pero satura la CPU.
encoder = "hardware"
# Bitrate objetivo del modo hardware (VideoToolbox no usa CRF).
bitrate_mbps = 12
# Calidad del modo software (CRF: menor = más calidad, ~18 es visualmente sin pérdida).
crf = 18
# Segundos de imagen que quedan tras acabar la narración, para que el video no
# corte en seco sobre la última palabra. Si los clips ya duran más que la voz,
# manda su duración y esta cola no se aplica. 0 = cortar con el audio.
cola_final_s = 1.5

[i2v]
# Modo image-to-video (movimiento generado por IA). Agnóstico al motor: apunta
# a un workflow de ComfyUI en formato API que TÚ exportas y ajustas (LTX-Video,
# WAN, etc.). El workflow debe incluir los placeholders {IMAGE}, {PROMPT} y
# {SEED}, y un nodo que guarde el video (VHS_VideoCombine / SaveVideo).
workflow = "workflows/i2v_api.json"
# Cuadros que genera el modelo i2v por escena (placeholder {FRAMES} del
# workflow). Más cuadros = más recorrido de movimiento y menos estiramiento de
# RIFE, pero el coste sube lineal (~12 s por cuadro en M3 Max). HunyuanVideo
# exige la forma 4n+1: 13, 17, 21, 25…
frames = 21
# fps que produce tu modelo i2v (para saber cuánto interpola RIFE).
fps_origen = 24
# fps de los clips i2v tras la interpolación. Déjalo en 60: es el ritmo al que
# el armado concatena los clips, así que cualquier otro valor obliga a ffmpeg a
# duplicar cuadros al final. RIFE genera los que hagan falta sin coste extra.
fps_final = 60

[rife]
# rife-ncnn-vulkan (descargado en Fase 0). Corre en GPU vía Vulkan/MoltenVK.
bin = "tools/rife-ncnn-vulkan-20221029-macos/rife-ncnn-vulkan"
modelo = "rife-v4.6"

[imagen]
# Motores de imagen disponibles. Cada uno declara los modos que sabe hacer
# apuntando a un workflow de ComfyUI en formato API: `generar` (texto→imagen,
# placeholders {PROMPT}, {SEED}, {WIDTH}, {HEIGHT}) y/o `editar` (instruct-edit
# sobre una imagen subida, placeholders {IMAGE}, {PROMPT}, {SEED}). Los
# placeholders numéricos van entrecomillados en el JSON para que el archivo siga
# siendo válido y puedas abrirlo tal cual en ComfyUI; Loomcast quita las comillas
# al sustituir.
#
# Motor que se preselecciona en la galería, y el que usa el pipeline de vídeo
# para las imágenes de escena.
motor_generar = "zimage"
motor_editar = "qwen"
# Tamaño que se usa cuando quien llama no especifica uno (pipeline de vídeo).
width = 768
height = 1344

[imagen.motores.zimage]
nombre = "Z-Image Turbo"
generar = "workflows/z_image_turbo_api.json"

[imagen.motores.qwen]
# Qwen-Image-Edit 2509 GGUF: reutiliza el text encoder qwen2.5-vl en GGUF y
# evita el fp8 que Metal no soporta. ~2 min por imagen.
nombre = "Qwen-Image-Edit 2509"
editar = "workflows/qwen_edit_api.json"

[imagen.motores.flux2klein]
# FLUX.2 Klein 9B (GGUF Q8_0 + encoder qwen_3_8b_fp4mixed): genera y edita con
# los mismos pesos. ~50 s generando y ~76 s editando en el M3 Max.
nombre = "FLUX.2 Klein 9B"
generar = "workflows/flux2_klein_t2i_api.json"
editar = "workflows/flux2_klein_edit_api.json"

[musica]
# Generación de música local con ACE-Step 1.5 XL Turbo (ACE Studio + StepFun):
# corre en Apple Silicon vía Metal/MPS y tiene soporte nativo en ComfyUI (nodos
# TextEncodeAceStepAudio1.5 / EmptyAceStep1.5LatentAudio, sin custom nodes).
# Sale a 48 kHz y, a diferencia de v1, acepta conditioning musical explícito
# (tempo, tonalidad, compás), que es lo que evita que el arreglo derive y los
# instrumentos se tapen entre sí.
#
# Descarga a ComfyUI/models/ desde Comfy-Org/ace_step_1.5_ComfyUI_files:
#   diffusion_models/  acestep_v1.5_xl_turbo_bf16.safetensors  (9,97 GB)
#   text_encoders/     qwen_0.6b_ace15.safetensors             (1,19 GB)
#   text_encoders/     qwen_4b_ace15.safetensors               (8,38 GB)
#   vae/               ace_1.5_vae.safetensors                 (0,34 GB)
# Ojo: NO hay versión GGUF usable en ComfyUI (los GGUF que circulan son para
# acestep.cpp, y ComfyUI-GGUF no soporta la arquitectura ace-step).
workflow = "workflows/musica_api.json"
# Duración por defecto de una pista nueva, en segundos.
duracion_s = 30
# IMPORTANTE: arranca ComfyUI con --gpu-only (`comfy launch -- --gpu-only`). Sin
# ese flag ComfyUI deja los text encoders en la CPU en todos los Mac, y aquí el
# "text encoder" es el LM de 4B que planifica la canción: 166,6 s por pista de
# 30 s en vez de 30,1 s. Ver la sección "Música" del README.
#
# Activa el LM planificador (generate_audio_codes): un Qwen que planea la
# estructura de la pista antes de sintetizarla. Es lo que sube la calidad y
# también el grueso del tiempo; ponlo en false para bajar a ~2 s por pista a
# costa de generar sin plan de estructura.
audio_codes = true

[paths]
proyectos = "proyectos"
plantillas = "plantillas"
voces = "voces"
galeria = "galeria"
musica = "musica"
db = "loomcast.db"
