[pytest]
testpaths = tests
# fase0/ son scripts manuales que cargan modelos reales: no son tests.
norecursedirs = fase0 web tools .venv node_modules
markers =
    integration: usa la API y una BD SQLite temporal (sin modelos ni GPU)
# Cobertura: `pytest --cov` (los umbrales viven en .coveragerc).
addopts = -ra
